import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
    id "com.gradleup.shadow" version "8.3.3"
    id "org.beryx.runtime" version "2.0.1"
    id 'org.graalvm.buildtools.native' version '0.11.1'
}

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

group 'jp.ac.aoyama.it.ke.mrcube'
version = '26.4.1'

application {
    mainClass.set('jp.ac.aoyama.it.ke.mrcube.MR3')
}

project.ext {
    moduleName = 'jp.ac.aoyama.it.ke'
    artifactId = 'mrcube'
    defaultEncoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

wrapper {
    gradleVersion = '8.6'
}

jar {
    manifest {
        attributes 'Main-Class': 'jp.ac.aoyama.it.ke.mrcube.MR3'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(JavaExec) {
    systemProperty 'file.encoding', 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'jp.ac.aoyama.it.ke.mrcube.MR3'
    }
}

runtime {
    enableCds()
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    imageDir = layout.buildDirectory.dir("mrcube-${version}")
    imageZip = layout.buildDirectory.file("mrcube-${version}.zip")

    jpackage {
        if (OperatingSystem.current().isWindows()) {
            jpackageHome = 'C:\\Program Files\\BellSoft\\LibericaJDK-21'
            installerType = 'msi'
            imageOptions = ['--verbose', '--icon', './src/main/resources/images/mr3.ico']
            installerOptions = ['--vendor', 'Takeshi Morita', '--win-shortcut']
        } else if (OperatingSystem.current().isMacOsX()) {
            jpackageHome = '/Library/Java/JavaVirtualMachines/liberica-jdk-21.jdk/Contents/Home'
            installerType = 'dmg'
            imageOptions = ['--verbose', '--icon', './src/main/resources/images/mr3.icns']
            installerOptions = ['--vendor', 'Takeshi Morita']
        }

        imageName = "mrcube-${version}"
        skipInstaller = false
        installerName = "mrcube"
    }
}

tasks.runtime.doLast {
    copy {
        from('./README.md')
        into(layout.buildDirectory.file("mrcube-${version}"))
    }
    copy {
        from('./README.ja.md')
        into(layout.buildDirectory.file("mrcube-${version}"))
    }
    copy {
        from('./LICENSE')
        into(layout.buildDirectory.file("mrcube-${version}"))
    }
}

task prepareNativePackage(type: Copy) {

    from(layout.buildDirectory.dir("/native/nativeCompile")) {
        include "*.exe"
        include "*.dll"
    }
    from('./README.md')
    from('./README.ja.md')
    from('./LICENSE')

    into layout.buildDirectory.dir("/native-package-input")
}

graalvmNative {

    binaries.all {
        resources.autodetect()
    }

    metadataRepository {
        enabled = true
    }

    binaries.main {
        mainClass = 'jp.ac.aoyama.it.ke.mrcube.MR3'
        buildArgs.add('--no-fallback')
        buildArgs.add('-H:+AddAllCharsets')
        buildArgs.add('-Djava.awt.headless=false')
    }
}

task runWithAgent(type: JavaExec) {
    group = "application"
    mainClass = application.mainClass
    classpath = sourceSets.main.runtimeClasspath

    def outputDir = file("src/main/resources/META-INF/native-image")

    jvmArgs = [
            "-agentlib:native-image-agent=config-output-dir=${outputDir}"
    ]

    doFirst {
        if (!outputDir.exists()) outputDir.mkdirs()
    }
}

dependencies {
    implementation 'com.formdev:flatlaf:3.7.1'
    implementation 'com.formdev:flatlaf-extras:3.7.1'
    implementation 'jgraph:jgraph:5.13.0.0'
    implementation 'org.apache.jena:jena-core:5.6.0'
    implementation 'org.apache.jena:jena-arq:5.6.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'org.apache.xmlgraphics:batik-svg-dom:1.19'
    implementation 'org.apache.xmlgraphics:batik-svggen:1.19'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
}

